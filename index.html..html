<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maturitné Zadania</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-orange-500 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-orange-500/20 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <i class="fa-solid fa-graduation-cap text-white text-lg"></i>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="progress-text" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-orange-500/10 text-orange-400 border border-orange-500/20">
                    Naučené: 0 / 0
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Hero section -->
        <div class="text-center max-w-2xl mx-auto mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">
                Prehľad maturitných zadaní
            </h1>
            <p class="text-slate-400 text-sm sm:text-base">
                Rýchly prehľad tém, kľúčové body k úspešnej odpovedi a sledovanie tvojho pokroku.
            </p>
        </div>

        <!-- Search & Filters -->
        <div class="flex flex-col sm:flex-row gap-4 mb-8 justify-between items-center">
            <!-- Search bar -->
            <div class="relative w-full sm:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Hľadať tému alebo kľúčové slovo..." 
                    class="w-full bg-slate-900 border border-slate-800 focus:border-orange-500 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all shadow-inner">
            </div>

            <!-- Subject Filter Tabs -->
            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-start sm:justify-end" id="subject-filters">
                <button onclick="filterSubject('all')" class="subject-btn px-4 py-2 rounded-xl text-xs font-semibold bg-orange-500 text-white transition-all shadow-md shadow-orange-500/20">Všetky</button>
                <button onclick="filterSubject('slovenčina')" class="subject-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-orange-500/50 transition-all">Slovenčina</button>
                <button onclick="filterSubject('programovanie')" class="subject-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-orange-500/50 transition-all">Programovanie</button>
                <button onclick="filterSubject('siete')" class="subject-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-orange-500/50 transition-all">Siete</button>
            </div>
        </div>

        <!-- Grid of Topics -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="topics-grid">
            <!-- Dynamically populated via JS -->
        </div>

    </main>

    <!-- Modal for Detail -->
    <div id="topic-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-orange-500/30 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute right-4 top-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div id="modal-category" class="text-xs font-bold text-orange-400 uppercase tracking-wider mb-1"></div>
            <h2 id="modal-title" class="text-xl font-bold text-white mb-4"></h2>
            
            <div class="space-y-4 mb-6">
                <div>
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kľúčové body k odpovedi:</h3>
                    <ul id="modal-points" class="space-y-2 text-sm text-slate-300 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
                    </ul>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all">Zavrieť</button>
                <button id="modal-toggle-btn" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-orange-500 hover:bg-orange-600 text-white transition-all shadow-lg shadow-orange-500/20">Označiť ako naučené</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const topics = [];

        let currentFilter = 'all';
        let searchQuery = '';
        let learnedTopics = JSON.parse(localStorage.getItem('learned_topics')) || [];

        const grid = document.getElementById('topics-grid');
        const searchInput = document.getElementById('search-input');
        const progressText = document.getElementById('progress-text');

        function renderTopics() {
            grid.innerHTML = '';
            
            const filtered = topics.filter(t => {
                const matchesSubject = currentFilter === 'all' || t.subject === currentFilter;
                const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.number.toString().includes(searchQuery);
                return matchesSubject && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500">
                        <i class="fa-solid fa-folder-open text-3xl mb-3 text-orange-500/50"></i>
                        <p class="text-sm font-medium text-slate-400">Zatiaľ tu nie sú pridané žiadne témy.</p>
                    </div>
                `;
                progressText.innerText = `Naučené: ${learnedTopics.length} / ${topics.length}`;
                return;
            }

            filtered.forEach(t => {
                const isLearned = learnedTopics.includes(t.id);
                const card = document.createElement('div');
                card.className = `bg-slate-900 border rounded-2xl p-5 flex flex-col justify-between transition-all hover:border-orange-500/50 group relative ${isLearned ? 'border-orange-500/40 bg-orange-950/10' : 'border-slate-800'}`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-orange-500/10 text-orange-400 border border-orange-500/20 uppercase tracking-wider">
                                #${t.number} • ${t.subject}
                            </span>
                            <button onclick="toggleLearned(${t.id}, event)" title="${isLearned ? 'Označiť ako nenaučené' : 'Označiť ako naučené'}" 
                                class="w-8 h-8 rounded-full flex items-center justify-center transition-colors ${isLearned ? 'bg-orange-500 text-white shadow-md shadow-orange-500/20' : 'bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-check text-xs"></i>
                            </button>
                        </div>
                        <h3 class="font-bold text-base text-white mb-3 group-hover:text-orange-400 transition-colors cursor-pointer" onclick="openModal(${t.id})">
                            ${t.title}
                        </h3>
                        <ul class="space-y-1.5 mb-4 text-xs text-slate-400">
                            ${t.points.map(p => `<li class="flex items-center space-x-2"><i class="fa-solid fa-circle text-[4px] text-orange-500"></i><span class="truncate">${p}</span></li>`).join('')}
                        </ul>
                    </div>
                    <button onclick="openModal(${t.id})" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-orange-500 hover:text-white text-slate-300 font-semibold text-xs transition-all flex items-center justify-center space-x-2">
                        <span>Zobraziť detail</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                `;
                grid.appendChild(card);
            });

            progressText.innerText = `Naučené: ${learnedTopics.length} / ${topics.length}`;
            localStorage.setItem('learned_topics', JSON.stringify(learnedTopics));
        }

        function filterSubject(subj) {
            currentFilter = subj;
            document.querySelectorAll('.subject-btn').forEach(btn => {
                btn.className = "subject-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-orange-500/50 transition-all";
            });
            event.target.className = "subject-btn px-4 py-2 rounded-xl text-xs font-semibold bg-orange-500 text-white transition-all shadow-md shadow-orange-500/20";
            renderTopics();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTopics();
        });

        function toggleLearned(id, event) {
            event.stopPropagation();
            if (learnedTopics.includes(id)) {
                learnedTopics = learnedTopics.filter(item => item !== id);
            } else {
                learnedTopics.push(id);
            }
            renderTopics();
        }

        function openModal(id) {
            const t = topics.find(item => item.id === id);
            if (!t) return;

            document.getElementById('modal-category').innerText = `#${t.number} • ${t.subject}`;
            document.getElementById('modal-title').innerText = t.title;
            
            const pointsList = document.getElementById('modal-points');
            pointsList.innerHTML = t.points.map(p => `<li class="flex items-start space-x-2"><i class="fa-solid fa-check text-orange-500 mt-1"></i><span>${p}</span></li>`).join('');

            const toggleBtn = document.getElementById('modal-toggle-btn');
            const isLearned = learnedTopics.includes(id);
            toggleBtn.innerText = isLearned ? 'Označiť ako nenaučené' : 'Označiť ako naučené';
            toggleBtn.onclick = () => {
                toggleLearned(id, { stopPropagation: () => {} });
                openModal(id);
            };

            document.getElementById('topic-modal').classList.remove('hidden');
            document.getElementById('topic-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('topic-modal').classList.remove('flex');
            document.getElementById('topic-modal').classList.add('hidden');
        }

        renderTopics();
    </script>
</body>
</html>
